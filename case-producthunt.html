<script type="text/babel">
// Product Hunt orange accent
const accent = "oklch(0.68 0.19 40)";

const useLang = () => {
  const [lang, setLang] = React.useState(() => {
    const u = new URLSearchParams(location.search).get("lang");
    return u === "ru" ? "ru" : (localStorage.getItem("lang") === "ru" ? "ru" : "en");
  });
  React.useEffect(() => {
    localStorage.setItem("lang", lang);
    const u = new URL(location.href);
    u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.toString());
  }, [lang]);
  return [lang, setLang];
};

const Section = ({ num, title, children }) => (
  <section style={{ padding: "48px 32px", maxWidth: 980, margin: "0 auto", borderTop: "1px solid #1F1F1F" }}>
    <div style={{ display: "flex", alignItems: "baseline", gap: 18, marginBottom: 28 }}>

      <h2 style={{ margin: 0, fontSize: 26, fontWeight: 500, letterSpacing: "-0.015em" }}>{title}</h2>
    </div>
    {children}
  </section>
);

const P = ({ children, size = 16 }) => (
  <p style={{ fontSize: size, lineHeight: 1.65, color: "#B4B4B4", maxWidth: 720, margin: "0 0 16px" }}>{children}</p>
);

const Card = ({ h, d }) => (
  <div style={{ padding: 24, borderRadius: 10, background: "#0F0F0F", border: "1px solid #1F1F1F" }}>

);

            <li>{L("Personal Telegram messages — ", "Личные сообщения в Telegram — ")}<span style={{ color: accent }}>{L("best channel", "лучший канал")}</span></li>
