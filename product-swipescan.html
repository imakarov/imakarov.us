<script type="text/babel">
const accent = "oklch(0.72 0.16 250)";
const product = window.SITE.independent.find(p => p.id === "swipescan");

const Page = () => (
  <ProductPage product={product} accent={accent} site="https://apps.apple.com/us/app/swipescan-capture-text/id6742683450">
    <ProdSection num="01" title="What it is" accent={accent}>
      <p style={{ fontSize: 17, lineHeight: 1.6, color: "#B4B4B4", maxWidth: 720, margin: 0 }}>
        SwipeScan is a Tinder-style document scanner for iOS. Capture
        a stack of documents, then swipe through them to keep, delete, or
        re-scan — review faster than any traditional scanner app.
      </p>
    </ProdSection>

    <ProdSection num="02" title="Key features" accent={accent}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16 }}>
        {[
          ["Swipe to triage", "Right keeps, left deletes, up rescans. Burn through a pile in seconds."],
          ["AI auto-crop", "Edge detection + perspective correction in real time."],
          ["Smart bundles", "Group related scans into a single PDF automatically."],
          ["iCloud sync", "Everything synced, available everywhere, encrypted at rest."],
        ].map(([h, d]) => (
          <div key={h} style={{
            padding: 24, borderRadius: 10,
            background: "#0F0F0F", border: "1px solid #1F1F1F",
          }}>
            <div style={{ fontSize: 16, fontWeight: 500, marginBottom: 8 }}>{h}</div>
            <div style={{ fontSize: 13.5, color: "#B4B4B4", lineHeight: 1.55 }}>{d}</div>
          </div>
        ))}
      </div>
    </ProdSection>

    <ProdSection num="03" title="Why it exists" accent={accent}>
      <p style={{ fontSize: 16, lineHeight: 1.65, color: "#B4B4B4", maxWidth: 720, margin: 0 }}>
        Most scanner apps treat documents like files. SwipeScan treats them
        like photos — bulk capture, then triage. The interaction is faster
        because it matches how people actually use their phones.
      </p>
    </ProdSection>

    <ProdSection num="04" title="Status" accent={accent}>
      <div className="mono" style={{
        display: "grid", gridTemplateColumns: "140px 1fr", gap: "12px 24px",
        fontSize: 13, color: "#B4B4B4",
      }}>
        <span style={{ color: "#525252" }}>platform</span><span>iOS 17+</span>
        <span style={{ color: "#525252" }}>status</span><span style={{ color: accent }}>● Live on the App Store</span>
        <span style={{ color: "#525252" }}>roadmap</span><span>v2 — multi-device review, OCR search</span>
        <span style={{ color: "#525252" }}>website</span><span>imakarov.us/swipescan</span>
      </div>
    </ProdSection>
  </ProductPage>
);

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
