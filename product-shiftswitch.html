<title>ShiftSwitch — tap Shift to fix the keyboard layout · imakarov.us</title>
<meta name="description" content="Typed in the wrong layout? Tap Shift. ShiftSwitch is a tiny, free, open-source macOS app that retypes the last word in the other keyboard layout (ghbdtn → привет). Works in Terminal and iTerm2." />
<meta property="og:title" content="ShiftSwitch — tap Shift to fix the keyboard layout" />
<meta property="og:description" content="Tiny native macOS layout fixer: ghbdtn → привет with one Shift tap. Free and open source." />
<meta property="og:image" content="https://imakarov.us/assets/icon-shiftswitch.png" />

<style>
  .ss-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .ss-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .ss-grid2>*,.ss-grid3>*{min-width:0}
  .ss-card{padding:24px;border-radius:10px;background:#0F0F0F;border:1px solid #1F1F1F}
  .ss-card h3{margin:0 0 8px;font-size:16px;font-weight:500}
  .ss-card p{margin:0;font-size:13.5px;color:#B4B4B4;line-height:1.55}
  .ss-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;transition:transform .15s,opacity .15s}
  .ss-btn:hover{transform:translateY(-1px);opacity:.92}
  .ss-cmd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;background:#0F0F0F;border:1px solid #1F1F1F;font-size:14px;overflow-x:auto}
  .ss-cmd code{flex:1;white-space:nowrap;color:#EDEDED}
  .ss-cmd button{background:none;border:1px solid #2A2A2A;color:#B4B4B4;border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
  .ss-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:14px 0;border-bottom:1px solid #1A1A1A;font-size:14px;line-height:1.5}
  .ss-row span:first-child{color:#7A7A7A}
  .ss-demo{border-radius:14px;border:1px solid #1F1F1F;overflow:hidden;background:#0C0C0E}
  .ss-demo-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #1A1A1A}
  .ss-dot{width:11px;height:11px;border-radius:50%;background:#2A2A2A}
  .ss-demo-body{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:56px 48px;min-height:260px}
  .ss-line{font-size:44px;letter-spacing:-0.01em;white-space:nowrap}
  .ss-caret{display:inline-block;width:3px;height:44px;margin-left:4px;vertical-align:-6px;animation:ssblink 1s steps(1) infinite}
  @keyframes ssblink{50%{opacity:0}}
  .ss-key{width:150px;height:110px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(#1C1C22,#141418);border:1px solid #2C2C34;box-shadow:0 6px 0 #0A0A0C;transition:all .12s;flex-shrink:0}
  .ss-key.down{transform:translateY(5px);box-shadow:0 1px 0 #0A0A0C}
  .ss-layout{padding:3px 8px;border-radius:5px;border:1px solid #2A2A2A;font-size:11px}
  @media (max-width:720px){
    .ss-grid3,.ss-grid2{grid-template-columns:1fr}
    .ss-row{grid-template-columns:1fr;gap:4px}
    .ss-demo-body{flex-direction:column;padding:36px 20px;align-items:flex-start}
    .ss-line{font-size:32px}
    .ss-caret{height:32px}
    h1{font-size:48px !important}
  }
</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/site.js?v=20260928-1"></script>
<script type="text/babel" src="components/product-page.jsx?v=20260928-2"></script>

<script type="text/babel">
const accent = "oklch(0.72 0.17 285)";
const product = window.SITE.independent.find(p => p.id === "shiftswitch");
const REPO = "https://github.com/imakarov/shiftswitch";
const DMG = REPO + "/releases/latest/download/ShiftSwitch.dmg";
const SPONSOR = "https://github.com/sponsors/imakarov";
const BREW = "brew install --cask imakarov/tap/shiftswitch";

// Animated demo: type "ghbdtn" in EN, tap Shift, word becomes "привет" in RU. Loops.
const Demo = () => {
  const [st, setSt] = React.useState({ text: "", layout: "EN", down: false });
  React.useEffect(() => {
    const steps = [];
    const wrong = "ghbdtn", right = "привет";
    for (let i = 1; i <= wrong.length; i++) steps.push([140, { text: wrong.slice(0, i), layout: "EN", down: false }]);
    steps.push([900, { text: wrong, layout: "EN", down: true }]);
    steps.push([120, { text: wrong, layout: "EN", down: false }]);
    for (let i = wrong.length - 1; i >= 0; i--) steps.push([35, { text: wrong.slice(0, i), layout: "RU", down: false }]);
    for (let i = 1; i <= right.length; i++) steps.push([35, { text: right.slice(0, i), layout: "RU", down: false }]);
    steps.push([2600, { text: right, layout: "RU", down: false }]);
    steps.push([400, { text: "", layout: "EN", down: false }]);
    let i = 0, t;
    const run = () => { const [d, s] = steps[i]; t = setTimeout(() => { setSt(s); i = (i + 1) % steps.length; run(); }, d); };
    run();
    return () => clearTimeout(t);
  }, []);
  const ok = st.layout === "RU" && st.text.length > 0;
  return (
    <div className="ss-demo">
      <div className="ss-demo-bar">
        <span className="ss-dot" /><span className="ss-dot" /><span className="ss-dot" />
        <span className="mono" style={{ marginLeft: "auto", fontSize: 11, color: "#525252" }}>Terminal — zsh</span>
        <span className="mono ss-layout" style={{ color: st.layout === "RU" ? accent : "#7A7A7A" }}>{st.layout}</span>
      </div>
      <div className="ss-demo-body">
        <div className="ss-line mono">
          <span style={{ color: "#525252" }}>$ echo </span>
          <span style={{ color: ok ? accent : "#EDEDED" }}>{st.text}</span>
          <span className="ss-caret" style={{ background: accent }} />
        </div>
        <div className={"ss-key" + (st.down ? " down" : "")}>
          <span style={{ fontSize: 34, color: st.down ? accent : "#B4B4B4" }}>⇧</span>
          <span className="mono" style={{ fontSize: 11, color: "#7A7A7A" }}>tap shift</span>
        </div>
      </div>
    </div>
  );
};

const Copy = ({ text }) => {
  const [done, setDone] = React.useState(false);
  return (
    <div className="ss-cmd mono">
      <code>{text}</code>
      <button onClick={() => { navigator.clipboard.writeText(text); setDone(true); setTimeout(() => setDone(false), 1500); }}>
        {done ? "copied" : "copy"}
      </button>
    </div>
  );
};

const Card = ({ h, children }) => <div className="ss-card"><h3>{h}</h3><p>{children}</p></div>;
const Label = ({ children }) => <div className="mono" style={{ fontSize: 11, color: "#7A7A7A", marginBottom: 12, letterSpacing: "0.05em" }}>{children}</div>;
const Lead = ({ children, size = 17 }) => <p style={{ fontSize: size, lineHeight: 1.6, color: "#B4B4B4", maxWidth: 720, margin: 0 }}>{children}</p>;
const Btn = ({ href, primary, children }) => (
  <a className="ss-btn" href={href} target={primary ? undefined : "_blank"} rel="noopener"
     style={primary ? { background: accent, color: "#0A0A0A" } : { border: "1px solid #2A2A2A", color: "#EDEDED" }}>{children}</a>
);

const Page = () => {
  const [lang, setLang] = usePageLang();
  const t = (ru, en) => (lang === "ru" ? ru : en);
  React.useEffect(() => {
    document.title = t("ShiftSwitch — исправляет раскладку по нажатию Shift · imakarov.us",
                       "ShiftSwitch — tap Shift to fix the keyboard layout · imakarov.us");
  }, [lang]);
  const W = <span className="mono" style={{ color: "#EDEDED" }}>ghbdtn</span>;
  return (
  <ProductPage product={product} accent={accent} site={REPO} siteLabel="GitHub →" visual={<Demo />} lang={lang} setLang={setLang}>
    <ProdSection num="01" title={t("Что это", "What it is")} accent={accent}>
      <Lead>{t(
        <>Все, кто печатает на двух языках, знают {W} — это «привет», набранный не в той раскладке. ShiftSwitch
        исправляет это одной клавишей: короткое нажатие Shift — и последнее слово стирается, перепечатывается в другой
        раскладке, а система переключается, чтобы дальше вы печатали правильно. Повторное нажатие — отмена. Это бесплатная
        open-source замена ручного исправления из Punto Switcher и Caramba Switcher, написанная с нуля: крошечная и
        работающая там, где они ломаются, включая терминал.</>,
        <>Everyone who types in two languages knows {W} — «привет» typed with the wrong layout on. ShiftSwitch fixes it
        with one key: tap Shift, and the last word is erased, retyped in the other layout, and the system layout is
        switched so you keep typing correctly. Tap again to undo. It is a free, open-source replacement for the
        manual-conversion part of Punto Switcher and Caramba Switcher — written from scratch to be tiny and to work where
        they fail, including the terminal.</>)}</Lead>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 32 }}>
        <Btn href={DMG} primary>↓ {t("Скачать для macOS", "Download for macOS")}</Btn>
        <Btn href={REPO}>{t("Исходный код на GitHub", "Source on GitHub")}</Btn>
        <Btn href={SPONSOR}>♥ {t("Поддержать", "Sponsor")}</Btn>
      </div>
    </ProdSection>

    <ProdSection num="02" title={t("Как это работает", "How it works")} accent={accent}>
      <div className="ss-grid3">
        <Card h={t("1 · Печатаете", "1 · Type")}>{t("Как обычно. ShiftSwitch помнит только последнее слово — клавиши после последнего пробела.", "Type as usual. ShiftSwitch remembers only the last word — the keys since the last space.")}</Card>
        <Card h={t("2 · Нажимаете Shift", "2 · Tap Shift")}>{t("Не та раскладка? Нажмите и отпустите Shift, больше ничего. Shift с буквой и долгое удержание игнорируются.", "Wrong layout? Press and release Shift, nothing else. Shift+letter or a long hold are ignored.")}</Card>
        <Card h={t("3 · Готово", "3 · Done")}>{t("Слово перепечатано в другой раскладке, раскладка переключена. Можно сразу печатать дальше. Ещё раз Shift — отмена.", "The word is retyped in the other layout and the layout switches. Keep typing right away. Tap again to undo.")}</Card>
      </div>
    </ProdSection>

    <ProdSection num="03" title={t("Установка", "Install")} accent={accent}>
      <div className="ss-grid2">
        <div><Label>HOMEBREW</Label><Copy text={BREW} /></div>
        <div><Label>{t("ИЛИ СКАЧАТЬ", "OR DOWNLOAD")}</Label><Btn href={DMG} primary>↓ ShiftSwitch.dmg</Btn></div>
      </div>
      <p style={{ fontSize: 14, lineHeight: 1.6, color: "#7A7A7A", maxWidth: 720, margin: "24px 0 0" }}>{t(
        <>Перетащите в «Программы» и запустите. macOS попросит доступ к «Универсальному доступу» и «Мониторингу ввода»
        (Системные настройки → Конфиденциальность и безопасность) — без них нельзя видеть нажатия и перепечатывать слово.
        Включите <i>«Запускать при входе»</i> в меню значка. macOS 13 Ventura и новее, Apple Silicon и Intel.</>,
        <>Drag to Applications and launch. macOS will ask for Accessibility and Input Monitoring access (System Settings →
        Privacy &amp; Security) — they are needed to see keystrokes and retype the word. Enable <i>Launch at Login</i> from
        the menu bar icon. macOS 13 Ventura or later, Apple Silicon and Intel.</>)}</p>
    </ProdSection>

    <ProdSection num="04" title={t("Сделан на ошибках Punto и Caramba", "Built on the mistakes of Punto and Caramba")} accent={accent}>
      <div className="ss-grid2">
        <Card h={t("Работает в терминале", "Works in Terminal")}>{t("Никаких трюков с выделением и ⌘C/⌘V (в терминале ⌘C — это SIGINT). Слово стирается Backspace'ом и набирается заново — работает в Terminal, iTerm2, zsh.", "No select-copy-paste tricks (⌘C is SIGINT in a terminal). The word is erased with Backspace and retyped — works in Terminal, iTerm2, zsh.")}</Card>
        <Card h={t("х ъ ж э б ю ё — часть слова", "х ъ ж э б ю ё stay in the word")}>{t("Буквы на клавишах пунктуации не отрезаются, поэтому «их», «всё», «ещё» исправляются. Символы берутся из ваших реальных раскладок, включая «Русская – ПК».", "Letters living on punctuation keys aren't cut off, so «их», «всё», «ещё» convert. Characters come from your real layouts, incl. Russian – PC.")}</Card>
        <Card h={t("Без ложных срабатываний", "No false triggers")}>{t("Только одиночное нажатие. Любая клавиша, клик или модификатор во время нажатия отменяют его — никаких случайных замен, как с двойным Shift.", "A single tap only. Any key, click or modifier during the press cancels it — no accidental conversions like with double Shift.")}</Card>
        <Card h={t("Буквы не путаются", "No swapped letters")}>{t("Ждёт, пока раскладка реально переключится; нажатия, сделанные во время исправления, придерживаются и допечатываются по порядку. Работает в Slack, VS Code, Telegram.", "Waits until the layout switch lands; keys typed during a conversion are held and replayed in order. Paced for Slack, VS Code, Telegram.")}</Card>
        <Card h={t("Честно про Secure Input", "Honest about Secure Input")}>{t("Когда Secure Keyboard Entry блокирует все клавиатурные утилиты, значок-замок показывает, какое приложение его держит, — без всплывающих окон.", "When Secure Keyboard Entry blocks all keyboard tools, a lock icon shows which app holds it — no focus-stealing popups.")}</Card>
        <Card h={t("Крошечный", "Tiny")}>{t("≈300 КБ, универсальный бинарник, ≈11 МБ памяти, 0% CPU в простое. Один файл на Swift, без зависимостей.", "≈300 KB universal binary, ≈11 MB RAM, 0% CPU at idle. One Swift file, no dependencies.")}</Card>
      </div>
    </ProdSection>

    <ProdSection num="05" title={t("Приватность", "Privacy")} accent={accent}>
      <Lead size={16}>{t(
        "Без сети, телеметрии, аккаунтов, словарей, автопереключения и логов нажатий. В памяти хранится только последнее слово, и оно забывается при клике, Enter, Tab, стрелках или смене приложения. Весь исходный код — один читаемый файл на GitHub.",
        "No network access, no telemetry, no accounts, no dictionaries, no automatic switching, no keystroke logs. The only thing ShiftSwitch holds in memory is the last word, and it forgets it on a click, Enter, Tab, arrow keys or an app switch. The whole source is one readable file on GitHub.")}</Lead>
    </ProdSection>

    <ProdSection num="06" title={t("Статус", "Status")} accent={accent}>
      <div className="mono" style={{ fontSize: 13, color: "#B4B4B4", maxWidth: 720 }}>
        <div className="ss-row"><span>{t("платформа", "platform")}</span><span>macOS 13+ · Apple Silicon · Intel</span></div>
        <div className="ss-row"><span>{t("статус", "status")}</span><span style={{ color: accent }}>● v1.0.2 · {t("бесплатно", "free")}</span></div>
        <div className="ss-row"><span>{t("лицензия", "license")}</span><span>MIT, open source</span></div>
        <div className="ss-row"><span>{t("код", "source")}</span><a href={REPO} style={{ color: "#EDEDED" }}>github.com/imakarov/shiftswitch</a></div>
        <div className="ss-row"><span>{t("поддержка", "support")}</span><a href={SPONSOR} style={{ color: "#EDEDED" }}>GitHub Sponsors ♥</a></div>
      </div>
    </ProdSection>
  </ProductPage>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
