<script type="text/babel">
const accent = "oklch(0.78 0.14 145)";
const product = window.SITE.independent.find(p => p.id === "familychecklist");

const Page = () => (
  <ProductPage product={product} accent={accent} site="https://family-checklist.com">
    <ProdSection num="01" title="What it is" accent={accent}>
      <p style={{ fontSize: 17, lineHeight: 1.6, color: "#B4B4B4", maxWidth: 720, margin: 0 }}>
        FamilyCheckList is a shared list app built for households. Trips,
        groceries, chores, school items — everyone in the family sees the
        same lists, in real time, on any device.
      </p>
    </ProdSection>

    <ProdSection num="02" title="Key features" accent={accent}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16 }}>
        {[
          ["Real-time sync", "Tap a checkbox, the whole family sees it instantly."],
          ["Templates", "Pre-built lists for trips, holidays, grocery runs."],
          ["Cross-platform", "iOS, Android, and web — same account, same lists."],
          ["No account required", "Start with a family code. Sign in only when you want backup."],
        ].map(([h, d]) => (
          <div key={h} style={{
            padding: 24, borderRadius: 10,
            background: "#0F0F0F", border: "1px solid #1F1F1F",
          }}>
            <div style={{ fontSize: 16, fontWeight: 500, marginBottom: 8 }}>{h}</div>
            <div style={{ fontSize: 13.5, color: "#B4B4B4", lineHeight: 1.55 }}>{d}</div>
          </div>
        ))}
      </div>
    </ProdSection>

    <ProdSection num="03" title="Why it exists" accent={accent}>
      <p style={{ fontSize: 16, lineHeight: 1.65, color: "#B4B4B4", maxWidth: 720, margin: 0 }}>
        Existing list apps are built for solo productivity nerds. Families
        are messier — different devices, different habits, no shared
        workspace. FamilyCheckList is the simplest possible answer.
      </p>
    </ProdSection>

    <ProdSection num="04" title="Status" accent={accent}>
      <div className="mono" style={{
        display: "grid", gridTemplateColumns: "140px 1fr", gap: "12px 24px",
        fontSize: 13, color: "#B4B4B4",
      }}>
        <span style={{ color: "#525252" }}>platform</span><span>iOS · Android · Web</span>
        <span style={{ color: "#525252" }}>status</span><span style={{ color: accent }}>● Live on App Store, Play Store, web</span>
        <span style={{ color: "#525252" }}>roadmap</span><span>AI list suggestions, recurring lists</span>
        <span style={{ color: "#525252" }}>website</span><span>family-checklist.com</span>
      </div>
    </ProdSection>
  </ProductPage>
);

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
